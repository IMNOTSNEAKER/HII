name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # تثبيت بيئة فلاتر على سيرفر جيت هب
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # تحميل مكتبات المشروع
      - run: flutter pub get

      # بناء ملف الـ APK
      - run: flutter build apk --release

      # رفع ملف الـ APK عشان تقدر تحمله
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
